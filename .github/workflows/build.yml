name: build-windows-exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --onefile --console --name scourt_disclose scourt_disclose.py

      - uses: actions/upload-artifact@v4
        with:
          name: scourt_disclose_windows
          path: dist/scourt_disclose.exe
